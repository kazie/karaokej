name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm story:build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same tool as production; Podman is preinstalled on GitHub's Ubuntu runners.
      - name: Build image with Podman (not published)
        run: podman build --tag localhost/karaokej:ci .
